<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 页面不存在</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light dark;
      --accent-1: #6366f1;
      --accent-2: #a855f7;
      --bg: #f7f8fc;
      --text: #0f172a;
      --muted: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { font-size: 1.6rem; margin-top: 1rem; }
    p { color: var(--muted); margin-top: 0.7rem; }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.7rem 1.8rem;
      border-radius: 999px;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>你可能输错了地址，或者这个页面已经被移走了。</p>
    <a href="./">回到首页</a>
  </div>
</body>
</html>
